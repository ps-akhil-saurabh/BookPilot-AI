version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./bookpilot.db
      - CHROMADB_PATH=./chromadb_data
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-llama-3.1-70b-versatile}
    volumes:
      - ./backend/bookpilot.db:/app/bookpilot.db
      - ./backend/chromadb_data:/app/chromadb_data
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
